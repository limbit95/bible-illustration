production_intent: >
  창세기 1:1–13의 창조 흐름을 본문 순서에 따라 시각화한다.
  본문이 특정하지 않는 부분은 과도하게 구체화하지 않는 최소 구현 원칙을 따르고,
  연속된 장면은 같은 세계가 다음 상태로 변화하는 것처럼 continuity를 유지한다.

