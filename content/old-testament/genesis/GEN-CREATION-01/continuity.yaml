episode_id: GEN-CREATION-01

episode_boundary: null

segments:
  - key: S01
    start_cut_id: GEN-CREATION-01-C01
    end_cut_id: GEN-CREATION-01-C01
    baseline:
      visual:
        presentation: black-screen

  - key: S02
    start_cut_id: GEN-CREATION-01-C02
    end_cut_id: GEN-CREATION-01-C04
    baseline:
      world:
        environment: primordial-undifferentiated-waters
        separation_state: pre-firmament-pre-land-sea
        absent_elements:
          - sun
          - moon
          - stars
          - land
          - plants
          - animals
          - humans
      visual:
        horizon_state: undefined
        camera_context: broad-world-view
        primary_light_direction: none
        light_presence: absent

  - key: S03
    start_cut_id: GEN-CREATION-01-C05
    end_cut_id: GEN-CREATION-01-C05
    baseline:
      world:
        environment: primordial-waters-divided-by-expanse
        separation_state: firmament-established-pre-land
        absent_elements:
          - sun
          - moon
          - stars
          - land
          - plants
          - animals
          - humans
      visual:
        camera_context: broad-world-view
        horizon_state: undefined

transitions:
  - from: GEN-CREATION-01-C01
    to: GEN-CREATION-01-C02
    mode: reset

  - from: GEN-CREATION-01-C02
    to: GEN-CREATION-01-C03
    mode: continue
    retain:
      - world.environment
      - world.separation_state
      - world.absent_elements
      - visual.horizon_state
      - visual.camera_context
    change:
      - path: visual.primary_light_direction
        from: none
        to: right
      - path: visual.light_presence
        from: absent
        to: warm-gold-white

  - from: GEN-CREATION-01-C03
    to: GEN-CREATION-01-C04
    mode: continue
    retain:
      - world.environment
      - world.separation_state
      - world.absent_elements
      - visual.horizon_state
      - visual.camera_context
      - visual.primary_light_direction
      - visual.light_presence
    change:
      - path: visual.light_dark_distinction
        from: emerging
        to: strengthened

  - from: GEN-CREATION-01-C04
    to: GEN-CREATION-01-C05
    mode: partial_reset
    retain:
      - world.absent_elements
      - visual.camera_context
    reset:
      - visual.primary_light_direction
      - visual.light_presence
      - visual.light_dark_distinction
    change:
      - path: world.environment
        from: primordial-undifferentiated-waters
        to: primordial-waters-divided-by-expanse
      - path: world.separation_state
        from: pre-firmament-pre-land-sea
        to: firmament-established-pre-land
