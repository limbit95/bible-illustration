cut_id: GEN-CREATION-01-C05
episode_id: GEN-CREATION-01

scene_intent: >
  C04까지 하나의 원초적 물 세계로 이어지던 상태에서,
  위와 아래의 물 사이에 분리가 이제 막 시작되는 첫 순간을 보여준다.
  두 영역이 이미 완전히 갈라진 상태가 아니라,
  좁고 불규칙한 틈이 생기며 경계가 형성되기 시작하는 변화 자체가 핵심이다.

scene:
  summary: >
    C04의 짙은 남청색 물과 따뜻한 금백색 빛, 두껍고 유기적인 회화적 질감을 이어간다.
    화면 중앙부에서 물의 덩어리가 위와 아래로 조금씩 벌어지기 시작하지만,
    넓고 안정된 궁창 공간은 아직 완성되지 않는다.
    여러 부분에서 위아래 물의 흐름이 여전히 하나의 연속된 덩어리처럼 느껴져야 하며,
    관객이 '지금 막 분리가 시작되고 있다'고 인식할 수 있어야 한다.
  required_elements:
    - "위와 아래의 물 사이에 이제 막 생기기 시작한 좁고 불규칙한 틈"
    - "아직 상당 부분 서로 연결되어 보이는 원초적 물의 흐름"
    - "C04에서 이어지는 짙은 남청색과 따뜻한 금백색 빛"
    - "C04와 이어지는 두껍고 유기적인 회화적 물 질감"
    - "아직 육지가 드러나지 않은 상태"
  forbidden_elements:
    - "처음부터 넓고 완성된 궁창 공간"
    - "위의 물과 아래의 물이 이미 완전히 분리된 안정된 상태"
    - "현대적인 완성형 바다 수평선"
    - "태양, 달, 별 또는 명확한 천체"
    - "드러난 육지"
    - "식물, 동물 또는 인간"
    - "현대 지구의 푸른 대기권이나 우주에서 본 지구"
    - "고체 유리 돔이나 금속 천장처럼 단정된 궁창 구조"
    - "유리·크리스털처럼 지나치게 반짝이는 표면 질감"
    - "인간의 몸, 얼굴, 손 또는 실루엣으로 형상화된 하나님"
    - "이미지에 영구 삽입된 성경 구절, 장절 또는 내레이션"

