cut_id: GEN-CREATION-01-C05
episode_id: GEN-CREATION-01

scene_intent: >
  분리되지 않았던 원초적 물이 하나님의 말씀에 따라 위와 아래로 나뉘고,
  그 사이에 궁창이 형성되는 창조의 다음 상태 변화를 보여준다.
  본문이 궁창의 구체적인 물질·형태·우주 구조를 설명하지 않으므로
  특정 고대 우주론이나 현대 대기권 구조를 사실처럼 고정하지 않는다.

scene:
  summary: >
    C04까지 이어진 원초적 물 세계가 위와 아래로 갈라지기 시작하고,
    그 사이에 넓고 열린 공간이 분명하게 형성된다.
    위쪽에는 물의 층이 남아 있고 아래쪽에도 물이 존재하며,
    두 영역 사이의 분리가 장면의 핵심 시각적 초점이 된다.
    아직 육지, 식물, 태양, 달, 별, 동물, 인간은 나타나지 않는다.
  required_elements:
    - "위쪽 물과 아래쪽 물의 분리"
    - "두 물 영역 사이에 형성되는 넓은 궁창의 공간"
    - "C04에서 이어지는 창조 초기 세계의 연속성"
    - "아직 육지가 드러나지 않은 상태"
  forbidden_elements:
    - "태양, 달, 별 또는 명확한 천체"
    - "드러난 육지"
    - "식물, 동물 또는 인간"
    - "현대적인 완성형 바다 수평선"
    - "현대 지구의 푸른 대기권이나 우주에서 본 지구"
    - "고체 유리 돔이나 금속 천장처럼 단정된 궁창 구조"
    - "인간의 몸, 얼굴, 손 또는 실루엣으로 형상화된 하나님"
    - "이미지에 영구 삽입된 성경 구절, 장절 또는 내레이션"

