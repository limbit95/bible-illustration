cut_id: GEN-CREATION-01-C01
episode_id: GEN-CREATION-01

scene_intent: >
  태초의 창조 선언을 구체적인 우주·천체·지형 이미지로 과도하게 해석하지 않고,
  완전한 검은 화면으로 제시해 시작의 신비와 본문 자체에 집중하게 한다.

scene:
  summary: >
    화면 전체가 균일한 검은색으로 채워진다.
    구체적인 인물, 천체, 지형, 물체, 공간 구조 또는 이미지 내부 텍스트를 표현하지 않는다.
  required_elements:
    - "완전한 검은 화면"
  forbidden_elements:
    - "보이는 별, 행성, 태양, 달 또는 천체"
    - "구체적인 지형, 바다, 건축 또는 자연 풍경"
    - "인물 또는 인간형 신적 형상"
    - "이미지에 영구 삽입된 성경 구절, 장절 또는 내레이션"

