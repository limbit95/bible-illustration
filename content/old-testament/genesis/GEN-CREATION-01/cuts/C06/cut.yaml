cut_id: GEN-CREATION-01-C06
episode_id: GEN-CREATION-01

scene_intent: >
  C05에서 시작된 물의 분리가 계속 진행되어,
  위의 물과 아래의 물 사이에 궁창의 공간이 분명하게 형성된 다음 상태를 보여준다.
  C05와 같은 세계·질감·색조를 유지하면서도
  두 이미지의 연속 비교에서 분리의 진전이 명확하게 느껴져야 한다.

scene:
  summary: >
    C05의 짙은 남청색 물, 따뜻한 금백색 빛,
    두껍고 유기적인 회화적 질감을 그대로 유지한다.
    C05에서 좁게 열리기 시작했던 틈이 더 넓어져
    위쪽 물과 아래쪽 물 사이에 분명한 열린 공간이 형성된다.
    그러나 현대적 하늘과 바다의 수평선처럼 보이지 않고,
    여전히 창조 초기의 원초적 세계로 읽혀야 한다.
  required_elements:
    - "C05보다 확연히 넓어진 위아래 물 사이의 공간"
    - "서로 분명히 구분되는 위쪽 물과 아래쪽 물"
    - "C05와 이어지는 짙은 남청색과 따뜻한 금백색 빛"
    - "C05와 동일한 두껍고 유기적인 회화적 물 질감"
    - "궁창이 형성된 창조 초기의 공간감"
    - "아직 육지가 드러나지 않은 상태"
  forbidden_elements:
    - "C05와 차이가 거의 없는 미세한 분리"
    - "현대적인 완성형 바다 수평선"
    - "태양, 달, 별 또는 명확한 천체"
    - "드러난 육지"
    - "식물, 동물 또는 인간"
    - "현대 지구의 푸른 대기권이나 우주에서 본 지구"
    - "고체 유리 돔이나 금속 천장처럼 단정된 궁창 구조"
    - "유리·크리스털처럼 지나치게 반짝이는 표면 질감"
    - "인간의 몸, 얼굴, 손 또는 실루엣으로 형상화된 하나님"
    - "이미지에 영구 삽입된 성경 구절, 장절 또는 내레이션"

