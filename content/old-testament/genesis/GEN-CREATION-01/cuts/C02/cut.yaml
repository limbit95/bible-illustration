cut_id: GEN-CREATION-01-C02
episode_id: GEN-CREATION-01

scene_intent: >
  창세기 1:2의 혼돈과 공허, 깊은 어둠과 수면의 상태를 보여준다.
  이 시점은 아직 궁창에 의한 물의 분리와 육지/바다의 구분 이전이므로,
  오늘날의 하늘·바다·육지가 완성된 자연 풍경처럼 보이지 않도록 한다.

scene:
  summary: >
    짙은 흑청색의 원초적 물과 깊음이 공간 전체에 무정형으로 이어지고 깊은 어둠이 지배한다.
    물과 위쪽 공간 사이의 경계가 명확하지 않으며,
    하늘과 바다와 육지가 서로 분리된 현재의 세계처럼 인식되지 않는 초기 상태다.
    안개와 흐름은 존재할 수 있으나 강한 광원은 없다.
  required_elements:
    - "짙은 흑청색의 원초적 물과 깊음"
    - "넓은 어둠과 공허한 분위기"
    - "물과 위쪽 공간의 경계가 뚜렷하지 않은 무정형 상태"
    - "하늘·바다·육지의 분리 이전이라는 인상"
    - "강한 광원이 없는 상태"
  forbidden_elements:
    - "태양, 달, 별 또는 명확한 천체"
    - "완성된 현대적 바다 또는 폭풍 해양 풍경"
    - "뚜렷한 바다 수평선과 완성된 하늘/바다의 분리"
    - "드러난 육지"
    - "식물, 동물 또는 인간"
    - "인간의 몸, 얼굴, 손 또는 실루엣으로 형상화된 하나님"

