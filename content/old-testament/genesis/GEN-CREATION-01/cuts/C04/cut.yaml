cut_id: GEN-CREATION-01-C04
episode_id: GEN-CREATION-01

scene_intent: >
  CUT 3에서 등장한 빛이 새로운 폭발처럼 다시 생기는 것이 아니라,
  같은 세계 안에서 빛과 어둠이 구별되고 질서화되는 다음 순간을 보여준다.

scene:
  summary: >
    CUT 3의 원초적 수면과 오른쪽의 따뜻한 광원 방향을 그대로 유지한다.
    오른쪽은 더 밝아지고 왼쪽은 깊은 어둠을 유지하며,
    빛과 어둠의 구별이 더 분명해진 상태다.
  required_elements:
    - "CUT 3와 이어지는 원초적 수면 세계"
    - "오른쪽의 따뜻한 빛 영역"
    - "왼쪽의 깊은 어둠 영역"
    - "빛과 어둠의 구별이 강화된 상태"
  forbidden_elements:
    - "새로운 두 번째 빛의 폭발"
    - "태양, 달, 별 또는 명확한 천체"
    - "드러난 육지"
    - "식물, 동물 또는 인간"
    - "인간의 몸, 얼굴, 손 또는 실루엣으로 형상화된 하나님"

