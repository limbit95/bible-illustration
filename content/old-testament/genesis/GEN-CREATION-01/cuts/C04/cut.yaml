cut_id: GEN-CREATION-01-C04
episode_id: GEN-CREATION-01

scene_intent: >
  C03에서 등장한 빛이 새로운 폭발처럼 다시 생기는 것이 아니라,
  아직 하늘·바다·육지가 분리되지 않은 같은 원초적 세계 안에서
  빛과 어둠이 구별되고 질서화되는 다음 순간을 보여준다.

scene:
  summary: >
    C03의 무정형 원초적 물 세계와 오른쪽의 따뜻한 광원 방향을 그대로 유지한다.
    오른쪽은 더 밝아지고 왼쪽은 깊은 어둠을 유지하며,
    빛과 어둠의 구별이 더 분명해진다.
    그러나 아직 완성된 하늘, 바다, 육지의 구획은 나타나지 않는다.
  required_elements:
    - "C03와 이어지는 분리 이전의 원초적 물 세계"
    - "오른쪽의 따뜻한 빛 영역"
    - "왼쪽의 깊은 어둠 영역"
    - "빛과 어둠의 구별이 강화된 상태"
  forbidden_elements:
    - "새로운 두 번째 빛의 폭발"
    - "태양, 달, 별 또는 명확한 천체"
    - "완성된 하늘과 바다의 뚜렷한 수평선"
    - "드러난 육지"
    - "식물, 동물 또는 인간"
    - "인간의 몸, 얼굴, 손 또는 실루엣으로 형상화된 하나님"

