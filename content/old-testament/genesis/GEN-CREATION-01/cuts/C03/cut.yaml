cut_id: GEN-CREATION-01-C03
episode_id: GEN-CREATION-01

scene_intent: >
  C02의 하늘·바다·육지 분리 이전 원초적 물 세계를 그대로 이어가면서,
  오른쪽 부근에서 따뜻한 금백색 빛이 처음 등장하는 순간을 보여준다.

scene:
  summary: >
    C02와 동일한 무정형의 원초적 물과 깊음, 넓은 어둠이 이어진다.
    아직 하늘과 바다와 육지가 분리된 자연 풍경은 형성되지 않았다.
    화면 오른쪽 부근에서 따뜻한 금백색 빛이 처음 나타나며,
    태양·달·별 같은 천체는 존재하지 않는다.
  required_elements:
    - "C02와 이어지는 분리 이전의 원초적 물 세계"
    - "오른쪽 부근에서 처음 등장하는 따뜻한 금백색 빛"
    - "빛과 함께 여전히 남아 있는 깊은 어둠"
  forbidden_elements:
    - "태양, 달, 별 또는 빛의 원천을 천체로 확정하는 표현"
    - "완성된 하늘과 바다의 뚜렷한 수평선"
    - "드러난 육지"
    - "식물, 동물 또는 인간"
    - "인간의 몸, 얼굴, 손 또는 실루엣으로 형상화된 하나님"

