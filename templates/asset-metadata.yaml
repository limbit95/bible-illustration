# Bible Illustration — Asset metadata template
# Template status: v1.1 CONFIRMED / 2026-10-06 pre-production hardening
# Binary filename should be <ASSET_ID>.<ext>.
# Meaningful pixel changes require a new Asset ID.

asset_id: null

owner:
  # Allowed v1 owner types: cut | library
  type: null
  # For type=library, id is a Canonical Library Entity library_id.
  id: null

source:
  # Allowed: generation_result | manual_edit | user_supplied | external_import | derived_import
  kind: null
  result_id: null
  parent_asset_id: null

binary:
  storage: git_lfs
  path: null
  sha256: null
  media_type: null
  width: null
  height: null
  size_bytes: null

# Allowed: pending_ingest | available | missing | removed
availability: pending_ingest

# Required when availability=removed.
removal: null
# removal:
#   removed_at: null
#   reason: null
#   replacement_asset_id: null

created_at: null

provenance:
  provider: null
  note: null

rights:
  # storage_status: permitted | restricted | unknown
  storage_status: unknown
  # basis: project_generated | licensed | public_domain |
  #        permission_granted | user_asserted | other | unknown
  basis: unknown
  note: null
