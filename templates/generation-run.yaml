# Bible Illustration — Generation Run template
# Template status: v1.3 CONFIRMED / 2026-10-06 episode orchestration
# One actual Provider request = one Run.

run_id: null

target:
  cut_id: null
  cut_revision: null

entry_gate:
  scripture_work_unit_ready: null
  episode_ready: null
  storyboard_ready: null
  storyboard_preflight_passed: null
  cut_ready: null
  scene_relation_ready: null
  continuity_ready: null
  text_free_production_master: null
  provider_ready: null
  orchestration_ready: null
  presentation_plan_ready: null
  automation_test_mode: false

source_snapshot:
  repository_commit: null
  library: []
  # Library Entity snapshot entry:
  # - library_id: CHR-MOSES
  #   revision: 2
  #   profile: EXODUS

# Allowed: generate | edit | variation
operation: generate

provider:
  key: null
  model: null
  model_version: unknown
  execution_mode: null
  external_request_id: null

# Snapshot reusable integration configuration actually used by this Run.
integration:
  generation_profile:
    key: null
    revision: null
  prompt_adapter:
    key: null
    revision: null
  bindings: []
  fallbacks: []

prompt:
  observable_input_text: null
  provider_internal_prompt: unavailable
  negative_prompt: null

# Each entry records the actual delivered reference and its role.
# Project-owned binary references MUST use an available Canonical Asset ID in asset_ref.
# A working Result that will become an actual downstream reference is promoted first.
# When the reference represents a Library Entity, library_id/library_revision/profile may be added.
# Roles include character, location, object, costume, environment,
# style, continuity, composition, edit_source, other.
references: []

settings:
  aspect_ratio: null
  resolution: null
  seed: null
  provider_specific: {}

submitted_at: null

# Allowed: completed | partial | failed | cancelled
execution_status: null

usage:
  credits: null
  cost: null
  currency: null

# Result entry shape:
# - result_id: <RUN_ID>-O01
#   # Asset promotion is linked canonically from asset metadata source.result_id.
#   # Do not duplicate a mutable promoted_asset_ids reverse link here.
#   provider_output_id: null
#   reviews:
#     - sequence: 1
#       reviewed_at: ...
#       reviewed_against:
#         cut_revision: 1
#         repository_commit: ...
#       decision: accepted | rejected
#       evaluation:
#         scripture_fidelity: pass | concern | fail | not_applicable
#         historical_accuracy: pass | concern | fail | not_applicable
#         continuity: pass | concern | fail | not_applicable
#         library_consistency: pass | concern | fail | not_applicable
#         visual_quality: pass | concern | fail | not_applicable
#         technical_integrity: pass | concern | fail | not_applicable
#       issues: []
#       notes: null
results: []
